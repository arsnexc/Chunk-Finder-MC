plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { }
loom {
    splitEnvironmentSourceSets()
    mods {
        "chunkfinder" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
def modVersion = project.version.toString()
processResources {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") { expand "version": modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
// The UI core deliberately has no Minecraft dependencies. Compile/test it independently,
// while the normal client compilation still validates the real Minecraft/Fabric adapters.
sourceSets {
    uiRegression {
        java {
            srcDirs = ['src/client/java', 'src/uiTest/java']
            include 'dev/chunkfinder/ui/**'
        }
        resources.srcDirs = []
    }
}
tasks.register('uiRegressionTest', JavaExec) {
    group = 'verification'
    description = 'Headless layout, input, clipping and monochrome UI regression checks.'
    dependsOn tasks.named('uiRegressionClasses')
    classpath = sourceSets.uiRegression.runtimeClasspath
    mainClass = 'dev.chunkfinder.ui.UiRegressionTest'
    jvmArgs '-Djava.awt.headless=true'
    inputs.files(fileTree('src/main/resources/assets/chunkfinder/font'))
}
sourceSets {
    moduleRegression {
        java.srcDirs = ['src/moduleTest/java']
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
tasks.register('moduleRegressionTest', JavaExec) {
    group = 'verification'
    description = 'Selection, config migration and bounded loaded-world scan regression checks.'
    dependsOn tasks.named('moduleRegressionClasses')
    classpath = sourceSets.moduleRegression.runtimeClasspath
    mainClass = 'dev.chunkfinder.ModuleRegressionTest'
}
tasks.named('check') {
    dependsOn tasks.named('uiRegressionTest'), tasks.named('moduleRegressionTest')
}

// Native UI and module API-contract tests are a separate development-only mod, never shipped.
// Synthetic block access only: no world/server is started and no server EULA is accepted.
fabricApi.configureTests {
    createSourceSet = true
    modId = 'chunkfinder-client-tests'
    enableGameTests = false
    enableClientGameTests = true
    eula = false
}

def modArchiveName = project.archives_base_name.toString()
jar {
    from("LICENSE") { rename { "${it}_${modArchiveName}" } }
}
publishing {
    publications {
        create("mavenJava", MavenPublication) { from components.java }
    }
}
